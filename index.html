<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#FBF1EF">
  <title>Diana Fit</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.4/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&display=swap');
    * { box-sizing:border-box; margin:0; padding:0; }
    html { height:100%; } body { min-height:100%; } #root { min-height:100%; }
    body { background:#FBF1EF; color:#33272a; font-family:'Hanken Grotesk',sans-serif; -webkit-font-smoothing:antialiased; overscroll-behavior:none; font-size:15px; }
    button { cursor:pointer; border:none; outline:none; font-family:'Hanken Grotesk',sans-serif; background:none; }
    input { font-family:'Hanken Grotesk',sans-serif; outline:none; }
    ::-webkit-scrollbar { width:3px; } ::-webkit-scrollbar-thumb { background:#F0DEDA; border-radius:2px; }
    @keyframes dfPulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.45; transform:scale(.82); } }
    @keyframes dfSpring { 0% { transform:scale(.6); } 55% { transform:scale(1.12); } 100% { transform:scale(1); } }
    @keyframes dfWarmGlow { 0%,100% { box-shadow:0 0 0 0 rgba(214,120,146,0); } 50% { box-shadow:0 0 44px 8px rgba(214,120,146,.45); } }
    @keyframes dfRise { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
    @keyframes dfDraw { from { stroke-dashoffset:620; } to { stroke-dashoffset:0; } }
    @keyframes dfUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    @media (prefers-reduced-motion: reduce) { * { animation-duration:.01ms !important; animation-iteration-count:1 !important; } }
  </style>
</head>
<body>
  <div id="root" style="display:flex;align-items:center;justify-content:center;height:100vh;color:#c9adaa;font-size:14px;letter-spacing:.5px;">laden…</div>
  <script type="text/babel">
    const {useState,useEffect,useRef,useMemo,useCallback}=React;

    // ══ DESIGN TOKENS (Handoff "Warm & spielerisch") ══════════════════════
    const T={ bg:"#FBF1EF", card:"#FFFAF9", ink:"#33272a", ink2:"#2b2426",
      t2:"#6b5257", muted:"#a2908d", muted2:"#b09a97", faint:"#c9adaa", ghost:"#c4afab", ghost2:"#d7bcc0",
      rose:"#D67892", roseD:"#c25f7b", roseL:"#E48DA3", roseTint:"#F6E1E4", roseTint2:"#F7E3E7", roseEye:"#c17b8a",
      sage:"#A6B58E", sageT:"#7f9161", sageTint:"#EAF0E2",
      lav:"#B99BC9", lavBg:"#F1E9F4", lavBr:"#E0D0E8", lavT:"#6a5473", lavT2:"#9683a0",
      amber:"#E0B27F", amberT:"#c8a15f",
      br:"#F0DEDA", br2:"#EFDED9", brDash:"#E7CFC9", track:"#F3E7E4", corridor:"#EFE1DD",
      heat:["#F3E7E4","#EFC9D3","#E39FB1","#D67892","#c25f7b"] };
    const MONO="'JetBrains Mono',monospace", SERIF="'Newsreader',serif";
    const CARD={background:T.card,border:`1px solid ${T.br}`,borderRadius:22};
    const EYEBROW={fontSize:12,letterSpacing:".12em",textTransform:"uppercase",color:T.faint,fontWeight:700};

    // ══ CORE-LOGIK (siehe revamp/dianafit-core.js + test-core.js) ═════════
    const INC=2.5;
    const INC_1KG=new Set(["Bizeps","Seitheben"]); // Freihanteln: 1-kg-Schritte
    const incFor=n=>INC_1KG.has(n)?1:INC;
    const roundInc=(w,n)=>{const i=incFor(n);return Math.round(w/i)*i;};
    const TYPES=[
      {id:"glute_heavy",label:"Glute Schwer",repRange:[6,10],defReps:8,defSets:4,rpeGate:7,restSec:60},
      {id:"upper",label:"Oberkörper",repRange:[8,12],defReps:10,defSets:3,rpeGate:8,restSec:60},
      {id:"other",label:"Kurs & Co",repRange:null,defReps:null,defSets:1,rpeGate:null,restSec:0},
    ];
    const VOLUME_VARIANT={repRange:[10,15],defReps:12,loadFactor:0.8,restSec:60};
    const GLUTE_EX=["Hip Thrust Elite","Pendulum Kickback","Seated Leg Curl","Hip Abduction","Hip Adduction","Hip Extension","Dual 45° Hip Extension","Hammer V-Squat Waden","Back Extension","Glute Bridge","Frog Pumps","Single-Leg Glute Bridge","Torso Rotation","Abdominal","Cable Woodchopper","RDL Kettlebell"];
    const UPPER_EX=["Lat Pulldown","Rudern","Chest Press","Fly","Shoulder Press","Seitheben","Rear Deltoid","Trizeps","Trizeps Pulldown","Bizeps","Torso Rotation","Abdominal","Cable Woodchopper"];
    const OTHER_EX=["Pilates","Yoga","Laufen","Schwimmen","Radfahren","Stretching / Mobility","Tanzen","Kraft-Kurs","Bouldern","Tennis","Spaziergang","Sonstiges"];
    const DEFAULT_PLAN={glute_heavy:["Hip Thrust Elite","Pendulum Kickback","Seated Leg Curl","Hip Abduction","Hip Adduction","Dual 45° Hip Extension","Torso Rotation","Abdominal"],
                        upper:["Lat Pulldown","Rudern","Chest Press","Shoulder Press","Fly","Trizeps","Trizeps Pulldown","Bizeps","Torso Rotation","Abdominal"]};
    const STRETCH_CUES={"Hip Thrust Elite":"tief starten, unten 1s halten","Back Extension":"volle Vorbeuge, unten kurz halten","Dual 45° Hip Extension":"volle Vorbeuge, unten kurz halten","Seated Leg Curl":"oben volle Streckung","Pendulum Kickback":"volle Vordehnung am Start","RDL Kettlebell":"Dehnung spüren, Rücken lang"};
    const MUSCLE_MAP={ Glutes:["Hip Thrust Elite","Pendulum Kickback","Hip Abduction","Hip Extension","Dual 45° Hip Extension","Back Extension","Glute Bridge","Frog Pumps","Single-Leg Glute Bridge","RDL Kettlebell","Seated Leg Curl"],
                       "Rücken":["Lat Pulldown","Rudern","Rear Deltoid","Bizeps"],
                       "Push & Schultern":["Chest Press","Fly","Shoulder Press","Seitheben","Trizeps","Trizeps Pulldown"] };
    const VOLUME_TARGETS={Glutes:[10,20],"Rücken":[4,6],"Push & Schultern":[3,5]};
    const getType=id=>TYPES.find(t=>t.id===id)||TYPES[0];
    const isTraining=id=>id==="glute_heavy"||id==="upper";
    const normType=t=>{ if(!t)return"other"; if(t==="upper")return"upper"; if(t==="other")return"other"; if(String(t).includes("glute"))return"glute_heavy"; return"other"; };
    const round25=w=>Math.round(w/2.5)*2.5;
    const e1rm=(w,r)=>(!w||!r)?0:+(w*(1+r/30)).toFixed(1);
    const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/86400000);
    const byDateDesc=ss=>[...ss].sort((a,b)=>new Date(b.date)-new Date(a.date));
    const bestSet=ex=>(ex.sets||[]).reduce((m,s)=>((s.weight||0)*1000+(s.reps||0)>(m.weight||0)*1000+(m.reps||0))?s:m,(ex.sets||[])[0]||{});
    const setVol=s=>(s.weight||0)*(s.reps||0);
    const localDate=(d=new Date())=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10);};
    const fmtDate=d=>new Date(d).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});
    const fmtW=w=>String(w).replace(".",",");

    function exerciseHistory(name,type,sessions,limit=4){
      const sorted=byDateDesc(sessions);
      const inType=sorted.filter(s=>normType(s.type)===normType(type)&&s.exercises?.some(e=>e.name===name));
      if(inType.length)return{scope:"type",sessions:inType.slice(0,limit)};
      const any=sorted.filter(s=>s.exercises?.some(e=>e.name===name));
      return{scope:any.length?"global":"none",sessions:any.slice(0,limit)};
    }
    // Kraft detrainiert in 1-2 Wochen praktisch nicht. Kurze Pausen: nur Feintuning.
    function pauseAdjustment(sessions,today){
      const tr=byDateDesc(sessions).filter(s=>isTraining(normType(s.type)));
      if(!tr.length)return{days:null,factor:1,note:null};
      const days=daysBetween(tr[0].date,today);
      if(days<=6)return{days,factor:1,note:null};
      if(days<=13)return{days,factor:0.9,note:`${days} Tage Pause. Vorschlag ~90%, eher Formsache. Fühlt es sich normal an: hochsteppern.`};
      if(days<=28)return{days,factor:0.75,note:`${days} Tage Pause. Einstieg bei ~75%, hochtasten.`};
      return{days,factor:0.6,note:`${days} Tage Pause. Sanfter Wiederaufbau, kein Stress.`};
    }
    function readinessPlan(energy,sleep,type){
      const r=(energy+sleep)/2;
      if(r>=4)return{score:r,mode:"normal",loadFactor:1,setFactor:1,allowPR:true,note:"Guter Tag. Normaler Plan."};
      if(r>=3)return{score:r,mode:"normal",loadFactor:1,setFactor:1,allowPR:false,note:"Solide. Heute kein neuer Last-Sprung."};
      if(type==="glute_heavy"&&r>=2)return{score:r,mode:"volume",loadFactor:VOLUME_VARIANT.loadFactor,setFactor:1,allowPR:false,note:"Müder Tag. Volume-Variante empfohlen."};
      if(r>=2)return{score:r,mode:"minimum",loadFactor:1,setFactor:0.6,allowPR:false,note:"Minimum-Modus. Kern bleibt, Rest gekürzt."};
      return{score:r,mode:"skip",loadFactor:1,setFactor:0,allowPR:false,note:"Ehrlich: heute lieber Spaziergang. Zählt trotzdem."};
    }
    function suggestNext(name,type,sessions,opts={}){
      const t=getType(normType(type)); const mode=opts.mode||"normal";
      const [repMin,repMax]=mode==="volume"?VOLUME_VARIANT.repRange:(t.repRange||[8,12]);
      const defReps=mode==="volume"?VOLUME_VARIANT.defReps:t.defReps;
      const hist=exerciseHistory(name,type,sessions);
      if(hist.scope==="none")return{name,weight:0,unit:"kg",sets:t.defSets,reps:defReps,tag:"neu",reason:"Noch keine Daten. Konservativ starten.",stall:0,scope:"none"};
      const last=hist.sessions[0].exercises.find(e=>e.name===name);
      const lb=bestSet(last); const unit=lb.unit||"kg"; const sets=last.sets.length;
      const worstReps=Math.min(...last.sets.map(s=>s.reps||0)); const lastRpe=last.rpe||null;
      const w=lb.weight||0;
      const scopeNote=hist.scope==="global"?" (aus anderem Session-Typ)":"";
      if(opts.pauseFactor&&opts.pauseFactor<1)
        return{name,weight:roundInc(w*opts.pauseFactor,name),unit,sets,reps:defReps,tag:"↩ Wiedereinstieg",reason:`Letzte Last ${fmtW(w)} ${unit}, Vorschlag ~${Math.round(opts.pauseFactor*100)}% nach Pause${scopeNote}.`,stall:0,scope:hist.scope};
      if(mode==="volume")
        return{name,weight:roundInc(w*VOLUME_VARIANT.loadFactor,name),unit,sets,reps:defReps,tag:"≈ Volume",reason:`Volume-Variante: ~80% von ${fmtW(w)} ${unit}, Ziel ${repMin}-${repMax} Wdh${scopeNote}.`,stall:0,scope:hist.scope};
      let stall=0;
      for(let i=0;i+1<hist.sessions.length;i++){
        const cur=bestSet(hist.sessions[i].exercises.find(e=>e.name===name));
        const prev=bestSet(hist.sessions[i+1].exercises.find(e=>e.name===name));
        if((cur.weight||0)<=(prev.weight||0)&&(cur.reps||0)<=(prev.reps||0))stall++; else break;
      }
      const allAtTop=last.sets.every(s=>(s.reps||0)>=repMax);
      const rpeOk=lastRpe===null||lastRpe<=t.rpeGate;
      const prevS=hist.sessions[1]?.exercises.find(e=>e.name===name);
      const prevAtTop=prevS&&bestSet(prevS).weight===w&&prevS.sets.every(s=>(s.reps||0)>=repMax);
      if(allAtTop&&prevAtTop&&rpeOk)return{name,weight:w+incFor(name),unit,sets,reps:repMin,tag:`↑ +${fmtW(incFor(name))}`,reason:`${repMax} Wdh in 2 Sessions. Aufladen, zurück auf ${repMin}${scopeNote}.`,stall:0,scope:hist.scope};
      if(allAtTop&&!rpeOk)return{name,weight:w,unit,sets,reps:repMax,tag:"= halten",reason:`Reps oben, aber RPE ${lastRpe} zu hoch. Erst leichter werden lassen${scopeNote}.`,stall,scope:hist.scope};
      if(allAtTop)return{name,weight:w,unit,sets,reps:repMax,tag:"↑ bald",reason:`${repMax} Wdh geschafft. Einmal bestätigen, dann +${fmtW(incFor(name))}${scopeNote}.`,stall,scope:hist.scope};
      if(worstReps>0&&worstReps<repMin)return{name,weight:Math.max(roundInc(w-incFor(name),name),incFor(name)),unit,sets,reps:defReps,tag:"↓ leichter",reason:`Schwächster Satz ${worstReps} Wdh, Ziel ${repMin}-${repMax}. Etwas runter${scopeNote}.`,stall,scope:hist.scope};
      const targetReps=Math.min((lb.reps||defReps)+1,repMax);
      return{name,weight:w,unit,sets,reps:targetReps,tag:"+1 Wdh",reason:`Letztes Mal ${sets}×${lb.reps||"?"} @ ${fmtW(w)} ${unit}${lb.unit==="pS"?"":""}. Heute ${targetReps} anpeilen${scopeNote}.`,stall,scope:hist.scope};
    }
    function checkPR(name,set,sessions){
      const prs=[]; const all=[];
      sessions.forEach(s=>s.exercises?.forEach(e=>{if(e.name===name)(e.sets||[]).forEach(x=>{if(x.unit!=="min")all.push(x);});}));
      if(!all.length)return prs;
      const maxW=Math.max(...all.map(s=>s.weight||0));
      const maxE=Math.max(...all.map(s=>e1rm(s.weight,s.reps)));
      if((set.weight||0)>maxW)prs.push({kind:"weight",value:set.weight,prev:maxW});
      else if(e1rm(set.weight,set.reps)>maxE)prs.push({kind:"e1rm",value:e1rm(set.weight,set.reps),prev:maxE});
      return prs;
    }
    function weekStart(dateStr){const d=new Date(dateStr);const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return localDate(d);}
    function weeklyGoal(sessions,today,goal=5){
      const ws=weekStart(today);
      const tw=sessions.filter(s=>s.date>=ws&&s.date<=today);
      const seen=new Set();const days=[];
      byDateDesc(tw).reverse().forEach(s=>{const k=s.date+normType(s.type);if(seen.has(k))return;seen.add(k);days.push(normType(s.type));});
      const training=days.filter(isTraining).length, courses=days.filter(d=>d==="other").length;
      return{done:training+courses,training,courses,goal,week:ws,kinds:days};
    }
    function weeklySets(sessions,today){
      const ws=weekStart(today);const out={};Object.keys(MUSCLE_MAP).forEach(m=>out[m]=0);
      sessions.filter(s=>s.date>=ws&&s.date<=today&&isTraining(normType(s.type))).forEach(s=>s.exercises?.forEach(e=>{
        Object.entries(MUSCLE_MAP).forEach(([m,names])=>{if(names.includes(e.name))out[m]+=(e.sets?.length||0);});}));
      return out;
    }
    function e1rmTrend(name,sessions,limit=16){
      return byDateDesc(sessions).filter(s=>s.exercises?.some(e=>e.name===name)).slice(0,limit)
        .map(s=>{const b=bestSet(s.exercises.find(e=>e.name===name));return{date:s.date,v:e1rm(b.weight,b.reps)};})
        .filter(p=>p.v>0).reverse();
    }
    const planNamesFor=(type,sessions)=>{
      const lastSame=byDateDesc(sessions).find(s=>normType(s.type)===type&&isTraining(type));
      const names=lastSame?(lastSame.planOrder&&lastSame.planOrder.length?lastSame.planOrder:lastSame.exercises.map(e=>e.name)):DEFAULT_PLAN[type];
      return names.filter(n=>n!=="Glute Schlitten");
    };
    function buildPlan(type,sessions,readiness,pause){
      const t=getType(type);
      const names=planNamesFor(type,sessions);
      const mode=readiness?readiness.mode:"normal";
      const setFactor=readiness?readiness.setFactor:1;
      let list=names.map(name=>{
        const p=suggestNext(name,type,sessions,{mode:mode==="volume"?"volume":"normal",pauseFactor:pause&&pause.factor<1?pause.factor:null});
        const nSets=Math.max(1,Math.round((p.sets||t.defSets)*setFactor));
        return{name,cue:STRETCH_CUES[name]||null,tag:p.tag,reason:p.reason,
          sets:Array.from({length:nSets},()=>({ghostWeight:p.weight,ghostReps:p.reps,weight:p.weight,reps:p.reps,unit:p.unit,committed:false}))};
      });
      return list;
    }

    // ══ STORAGE + GAS SYNC (kompatibel zu v3/v4) ══════════════════════════
    const SK="dfit-v3",GK="dfit-gas",AK="dfit-ak",ACT="dfit-active";
    const gGas=()=>localStorage.getItem(GK)||"";
    const rLS=()=>{try{const d=localStorage.getItem(SK);return d?JSON.parse(d):null;}catch{return null;}};
    const wLS=a=>{try{localStorage.setItem(SK,JSON.stringify(a));}catch{}};
    const rAct=()=>{try{const d=localStorage.getItem(ACT);return d?JSON.parse(d):null;}catch{return null;}};
    const wAct=a=>{try{if(a)localStorage.setItem(ACT,JSON.stringify(a));else localStorage.removeItem(ACT);}catch{}};
    const gGet=async()=>{const u=gGas();if(!u)return null;try{const c=new AbortController();setTimeout(()=>c.abort(),6000);const r=await fetch(u+"?t="+Date.now(),{signal:c.signal});const d=await r.json();return d.ok?d.sessions:null;}catch{return null;}};
    const gPost=async b=>{const u=gGas();if(!u)return null;try{const r=await fetch(u,{method:"POST",body:JSON.stringify(b)});return await r.json();}catch{return null;}};
    const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const vibrate=ms=>{try{navigator.vibrate&&navigator.vibrate(ms);}catch{}};

    // ══ APP ═══════════════════════════════════════════════════════════════
    function App(){
      const [sessions,setSessions]=useState([]);
      const [loaded,setLoaded]=useState(false);
      const [sync,setSync]=useState("idle");
      const [view,setView]=useState("home"); // home | workout | summary | progress
      const [active,setActive]=useState(null);
      const [summary,setSummary]=useState(null);
      const [cfg,setCfg]=useState(false);
      const [kurs,setKurs]=useState(false);

      // Loader-Styles vom #root entfernen, sonst blockiert height:100vh+centering das Hochscrollen
      useEffect(()=>{const r=document.getElementById('root');if(r)r.removeAttribute('style');},[]);
      useEffect(()=>{window.scrollTo(0,0);},[view]);

      useEffect(()=>{(async()=>{
        setSync("syncing");
        const ls=rLS()||[]; const gs=await gGet()||[];
        const gsMap=new Map(gs.map(s=>[s.id,s])); const lsMap=new Map(ls.map(s=>[s.id,s]));
        const merged=[...new Map([...lsMap,...gsMap]).values()].sort((a,b)=>new Date(b.date)-new Date(a.date));
        setSessions(merged); wLS(merged); setSync(gGas()?(gs.length||!merged.length?"ok":"error"):"idle"); setLoaded(true);
        if(gGas()&&ls.length){const un=ls.filter(s=>!gsMap.has(s.id));if(un.length)gPost({action:"init",sessions:merged}).then(r=>setSync(r?.ok?"ok":"error"));}
        const act=rAct();
        if(act){setActive(act);setView("workout");}
      })();},[]);

      useEffect(()=>{if(view==="workout")wAct(active);},[active,view]);

      const persist=async s=>{
        const a=[s,...sessions].sort((x,y)=>new Date(y.date)-new Date(x.date));
        setSessions(a); wLS(a); setSync("syncing");
        const r=await gPost({action:"save",session:s}); setSync(r?.ok?"ok":"error");
        return a;
      };
      const del=async id=>{
        const a=sessions.filter(s=>s.id!==id); setSessions(a); wLS(a); setSync("syncing");
        const r=await gPost({action:"delete",id}); setSync(r?.ok?"ok":"error");
      };

      const startWorkout=(type,readiness,mode)=>{
        const pause=pauseAdjustment(sessions,localDate());
        const rp=readiness?{...readinessPlan(readiness.energy,readiness.sleep,type),mode:mode||readinessPlan(readiness.energy,readiness.sleep,type).mode}:null;
        const plan=buildPlan(type,sessions,rp,pause);
        setActive({id:uid(),date:localDate(),type,label:getType(type).label+(rp&&rp.mode==="volume"?" · Volume":""),
          mode:rp?rp.mode:"normal",readiness:readiness||null,allowPR:rp?rp.allowPR:true,
          startedAt:Date.now(),exIndex:0,exercises:plan,pauseNote:pause.note});
        setView("workout");
      };
      const finishWorkout=(act)=>{
        const done=act.exercises.map(ex=>({name:ex.name,rpe:ex.rpe||undefined,
          sets:ex.sets.filter(s=>s.committed).map(s=>({weight:s.weight,reps:s.reps,unit:s.unit}))}))
          .filter(ex=>ex.sets.length);
        const durationMin=Math.max(1,Math.round((Date.now()-act.startedAt)/60000));
        const guestDone=act.guestName?act.exercises.map(ex=>({name:ex.name,
          sets:(ex.gsets||[]).filter(s=>s.committed).map(s=>({weight:s.weight,reps:s.reps,unit:s.unit}))}))
          .filter(ex=>ex.sets.length):null;
        const session={id:act.id,date:act.date,type:act.type,label:act.label,mode:act.mode,
          readiness:act.readiness,duration:durationMin,exercises:done,prs:act.prLog||[],
          planOrder:act.exercises.map(e=>e.name),
          guest:guestDone&&guestDone.length?{name:act.guestName,exercises:guestDone}:undefined};
        wAct(null); setActive(null);
        persist(session).then(()=>{setSummary(session);setView("summary");});
      };
      const abortWorkout=()=>{wAct(null);setActive(null);setView("home");};

      const saveKurs=(name,minutes)=>{
        const s={id:uid(),date:localDate(),type:"other",label:name,duration:minutes,
          exercises:[{name,sets:[{weight:minutes,reps:null,unit:"min"}]}]};
        persist(s); setKurs(false);
      };

      if(!loaded)return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:T.faint,fontSize:14}}>laden…</div>;
      return(
        <div style={{maxWidth:430,margin:"0 auto",minHeight:"100vh",background:T.bg,display:"flex",flexDirection:"column"}}>
          {view==="home"&&<Home sessions={sessions} sync={sync} onStart={startWorkout} onKurs={()=>setKurs(true)} onProgress={()=>setView("progress")} onCfg={()=>setCfg(true)}/>}
          {view==="workout"&&active&&<Workout act={active} setAct={setActive} sessions={sessions} onFinish={finishWorkout} onAbort={abortWorkout}/>}
          {view==="summary"&&summary&&<Summary session={summary} sessions={sessions} onDone={()=>{setSummary(null);setView("home");}}/>}
          {view==="progress"&&<Progress sessions={sessions} del={del} onBack={()=>setView("home")}/>}
          {kurs&&<KursSheet onSave={saveKurs} onClose={()=>setKurs(false)}/>}
          {cfg&&<Settings sessions={sessions} onClose={r=>{setCfg(false);if(r)window.location.reload();}}/>}
        </div>
      );
    }

    const SyncDot=({s})=>{const c={idle:"#d8c2be",syncing:T.amber,ok:T.sage,error:"#C03030"};
      return <span title={{ok:"Synchron",syncing:"Sync läuft",error:"Sync-Fehler",idle:"Offline"}[s]} style={{width:8,height:8,borderRadius:"50%",background:c[s]||c.idle,display:"inline-block",animation:s==="syncing"?"dfPulse 1.1s ease-in-out infinite":"none"}}/>;};

    // ══ HOME (2a) ═════════════════════════════════════════════════════════
    function Home({sessions,sync,onStart,onKurs,onProgress,onCfg}){
      const today=localDate();
      const [energy,setEnergy]=useState(null);
      const [sleep,setSleep]=useState(null);
      const lastTraining=byDateDesc(sessions).find(s=>isTraining(normType(s.type)));
      const dueType=lastTraining&&normType(lastTraining.type)==="glute_heavy"?"upper":"glute_heavy";
      const [tType,setTType]=useState(dueType);
      const readiness=energy&&sleep?{energy,sleep}:null;
      const rp=readiness?readinessPlan(energy,sleep,tType):null;
      const [volManual,setVolManual]=useState(null);
      const volOn=tType==="glute_heavy"&&(volManual!==null?volManual:(rp?rp.mode==="volume":false));
      const pause=pauseAdjustment(sessions,today);
      const lastSame=byDateDesc(sessions).find(s=>normType(s.type)===tType);
      const daysAgo=lastSame?daysBetween(lastSame.date,today):null;
      const wg=weeklyGoal(sessions,today);
      const planNames=planNamesFor(tType,sessions);
      const now=new Date();
      const clock=now.toLocaleTimeString("de-DE",{hour:"numeric",minute:"2-digit"});
      const dateStr=now.toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"long"});
      const greet=now.getHours()<11?"Morgen, Diana.":now.getHours()<18?"Hi, Diana.":"N'Abend, Diana.";
      const dots=[...wg.kinds.map(k=>isTraining(k)?T.rose:T.sage)];while(dots.length<wg.goal)dots.push(T.br2);

      const Chip=({v,sel,color,onTap})=>(
        <button onClick={onTap} style={{flex:1,height:38,borderRadius:12,background:sel?color:"#F6E4E1",color:sel?"#fff":"#cdb0ad",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:sel?800:700,fontSize:15,boxShadow:sel?`0 6px 14px -6px ${color}b0`:"none",transition:"all .15s"}}>{v}</button>);

      return(
        <div style={{padding:"26px 22px 30px",display:"flex",flexDirection:"column",gap:20,flex:1,animation:"dfUp .18s ease"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",fontFamily:MONO,fontSize:12,color:"#bfa5a2",fontWeight:500}}>
            <span>{clock}</span>
            <span style={{display:"flex",alignItems:"center",gap:10}}>{dateStr}<SyncDot s={sync}/><button onClick={onCfg} style={{color:"#bfa5a2",fontSize:14,padding:"2px 2px"}}>⚙</button></span>
          </div>
          <div>
            <div style={{fontSize:14,color:T.roseEye,fontWeight:600}}>{greet}</div>
            <div style={{fontSize:30,fontWeight:800,color:T.ink,letterSpacing:"-.01em",marginTop:2}}>Heute dran</div>
          </div>

          <div style={{...CARD,borderRadius:24,padding:"18px 18px 20px",display:"flex",flexDirection:"column",gap:16}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={EYEBROW}>Check-in</span><span style={{fontSize:12,color:T.faint}}>10 Sek.</span>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              <span style={{fontSize:14,fontWeight:700,color:T.t2}}>Energie</span>
              <div style={{display:"flex",gap:8}}>{[1,2,3,4,5].map(v=><Chip key={v} v={v} sel={energy===v} color={T.rose} onTap={()=>setEnergy(v)}/>)}</div>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              <span style={{fontSize:14,fontWeight:700,color:T.t2}}>Schlaf</span>
              <div style={{display:"flex",gap:8}}>{[1,2,3,4,5].map(v=><Chip key={v} v={v} sel={sleep===v} color={T.sage} onTap={()=>setSleep(v)}/>)}</div>
            </div>
            {rp&&<div style={{fontSize:12.5,color:T.muted,marginTop:-4}}>{rp.note}</div>}
          </div>

          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <span style={EYEBROW}>Empfehlung</span>
              <span style={{fontSize:13,color:T.roseEye,fontWeight:600}}>{tType==="glute_heavy"?"Heute ist Glute-Tag.":"Heute ist Oberkörper-Tag."}</span>
            </div>
            <div style={{background:`linear-gradient(155deg,${T.rose},${T.roseD})`,borderRadius:28,padding:"24px 22px",color:"#FCEEF0",boxShadow:"0 22px 40px -20px rgba(214,120,146,.85)"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div>
                  <div style={{fontSize:26,fontWeight:800,letterSpacing:"-.01em"}}>{getType(tType).label}{volOn?" · Volume":""}</div>
                  <div style={{fontSize:14,opacity:.85,marginTop:3}}>{daysAgo===null?"erstes Mal in der App":daysAgo===0?"heute schon geloggt":`zuletzt vor ${daysAgo} Tag${daysAgo===1?"":"en"}`}</div>
                </div>
                <span style={{fontFamily:MONO,fontSize:12,background:"rgba(255,255,255,.16)",padding:"5px 9px",borderRadius:9}}>~50 Min</span>
              </div>
              <div style={{fontSize:13,opacity:.9,marginTop:14,lineHeight:1.6}}>{planNames.join(" · ")}</div>
              {pause.note&&<div style={{fontSize:12.5,marginTop:10,background:"rgba(255,255,255,.14)",borderRadius:10,padding:"7px 10px"}}>{pause.note}</div>}
              <button onClick={()=>onStart(tType,readiness,volOn?"volume":null)} style={{marginTop:20,width:"100%",height:56,borderRadius:18,background:"#FCEEF0",color:T.roseD,fontSize:17,fontWeight:800}}>Starten →</button>
            </div>
            {tType==="glute_heavy"&&<div style={{marginTop:10,display:"flex",alignItems:"center",gap:12,background:T.lavBg,border:`1px solid ${T.lavBr}`,borderRadius:18,padding:"13px 16px"}}>
              <span style={{width:34,height:34,borderRadius:"50%",background:T.lav,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:17,flexShrink:0}}>☾</span>
              <div style={{flex:1}}>
                <div style={{fontSize:14,fontWeight:700,color:T.lavT}}>Müder Tag? Volume-Variante</div>
                <div style={{fontSize:12.5,color:T.lavT2}}>Gleicher Plan, ~20% leichter, 10-15 Wdh.</div>
              </div>
              <button onClick={()=>setVolManual(!volOn)} style={{width:44,height:26,borderRadius:20,background:volOn?T.lav:"#DCCDE4",position:"relative",flexShrink:0,transition:"background .15s"}}>
                <span style={{position:"absolute",top:3,left:volOn?21:3,width:20,height:20,borderRadius:"50%",background:"#fff",boxShadow:"0 1px 3px rgba(0,0,0,.2)",transition:"left .15s"}}/>
              </button>
            </div>}
          </div>

          <button onClick={onKurs} style={{display:"flex",alignItems:"center",gap:14,...CARD,borderRadius:20,padding:"14px 16px",textAlign:"left"}}>
            <span style={{width:38,height:38,borderRadius:12,background:T.sageTint,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,color:T.sageT,flexShrink:0}}>✦</span>
            <div style={{flex:1}}>
              <div style={{fontSize:15,fontWeight:700,color:T.t2}}>Kurs & Co</div>
              <div style={{fontSize:12.5,color:T.muted2}}>Pilates, Yoga, Laufen ... nur Dauer, zwei Taps.</div>
            </div>
            <span style={{fontSize:22,color:T.faint}}>+</span>
          </button>

          <div style={{display:"flex",flexDirection:"column",gap:14,marginTop:"auto"}}>
            <button onClick={()=>{setTType(tType==="glute_heavy"?"upper":"glute_heavy");setVolManual(null);}} style={{display:"flex",justifyContent:"space-between",alignItems:"center",width:"100%",padding:"2px 4px"}}>
              <span style={{fontSize:14,fontWeight:600,color:T.muted2}}>Stattdessen {tType==="glute_heavy"?"Oberkörper":"Glute Schwer"}?</span>
              <span style={{fontSize:13,color:T.faint,fontWeight:600}}>wechseln ⌄</span>
            </button>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"2px 4px"}}>
              <span style={{fontSize:14,color:"#8a7a77",fontWeight:600}}>Diese Woche</span>
              <div style={{display:"flex",alignItems:"center",gap:9}}>
                <div style={{display:"flex",gap:6}}>{dots.slice(0,7).map((c,i)=><span key={i} style={{width:11,height:11,borderRadius:"50%",background:c}}/>)}</div>
                <span style={{fontFamily:MONO,fontSize:13,color:"#8a7a77",fontWeight:500}}>{wg.done}/{wg.goal}</span>
              </div>
            </div>
            <button onClick={onProgress} style={{textAlign:"center",padding:"10px 4px 2px",fontSize:14,fontWeight:700,color:T.roseEye}}>Fortschritt ansehen →</button>
          </div>
        </div>
      );
    }

    // ══ WORKOUT (2b) + PR (2c) ════════════════════════════════════════════
    function Workout({act,setAct,sessions,onFinish,onAbort}){
      const t=getType(act.type);
      const restDefault=act.mode==="volume"?VOLUME_VARIANT.restSec:t.restSec;
      const [timer,setTimer]=useState(null); // {left, total}
      const [pr,setPr]=useState(null);
      const [picking,setPicking]=useState(false);
      const [confirmEnd,setConfirmEnd]=useState(false);
      const [guestSheet,setGuestSheet]=useState(false);
      const [overview,setOverview]=useState(false);
      const [drag,setDrag]=useState(null); // {i, y, dy, h}
      const ex=act.exercises[act.exIndex];
      const moveEx=(i,dir)=>setAct(a=>{
        const j=i+dir; if(j<0||j>=a.exercises.length)return a;
        const arr=[...a.exercises]; [arr[i],arr[j]]=[arr[j],arr[i]];
        const curName=a.exercises[a.exIndex].name;
        return{...a,exercises:arr,exIndex:arr.findIndex(e=>e.name===curName)};
      });
      const timerRef=useRef(null);
      const isGuest=act.track==="guest"&&!!act.guestName;
      const curSets=isGuest?(ex.gsets||[]):ex.sets;
      const GUEST={main:"#B99BC9",dark:"#9a7bb0",tint:"#F1E9F4",border:"#E0D0E8",text:"#6a5473"};
      const AC=isGuest?GUEST.main:T.rose, ACD=isGuest?GUEST.dark:T.roseD;
      const addGuest=name=>{
        setAct(a=>({...a,guestName:name,track:"guest",
          exercises:a.exercises.map(e=>({...e,gsets:e.gsets||e.sets.map(s=>({ghostWeight:s.weight,ghostReps:s.reps,weight:s.weight,reps:s.reps,unit:s.unit,committed:false}))}))}));
        setGuestSheet(false);
      };

      useEffect(()=>{
        if(!timer)return;
        timerRef.current=setInterval(()=>{
          setTimer(tm=>{
            if(!tm)return null;
            if(tm.left<=1){vibrate([120,80,120]);clearInterval(timerRef.current);return null;}
            return{...tm,left:tm.left-1};
          });
        },1000);
        return()=>clearInterval(timerRef.current);
      },[timer&&timer.id]);

      const KEY=isGuest?"gsets":"sets";
      const update=(fn)=>setAct(a=>{const ns={...a,exercises:a.exercises.map((e,i)=>i===a.exIndex?fn({...e,sets:e.sets.map(s=>({...s})),gsets:e.gsets?e.gsets.map(s=>({...s})):e.gsets}):e)};return ns;});
      const commitSet=(si)=>{
        const s=curSets[si]; if(!s||s.committed)return;
        update(e=>{e[KEY][si].committed=true;
          // Wert auf spätere, unveränderte Sätze derselben Spur übertragen
          for(let j=si+1;j<e[KEY].length;j++){const n=e[KEY][j];
            if(!n.committed&&n.weight===n.ghostWeight&&n.reps===n.ghostReps){n.weight=s.weight;n.reps=s.reps;}}
          return e;});
        vibrate(30);
        if(!isGuest&&s.unit!=="min"&&act.allowPR!==false){
          // Historie + bereits abgehakte Sätze DIESER Session, sonst feuert jeder Satz denselben PR erneut
          const histPlus=[...sessions,{id:"__active",date:act.date,type:act.type,
            exercises:act.exercises.map(e=>({name:e.name,sets:e.sets.filter((x,i2)=>x.committed&&!(e===ex&&i2===si)).map(x=>({weight:x.weight,reps:x.reps,unit:x.unit}))}))}];
          const prs=checkPR(ex.name,{weight:s.weight,reps:s.reps,unit:s.unit},histPlus);
          if(prs.length){const p={exercise:ex.name,kind:prs[0].kind,value:prs[0].value,unit:s.unit};setPr(p);
            setAct(a=>({...a,prLog:[...(a.prLog||[]),p]}));vibrate([40,60,80]);}
        }
        const allDone=curSets.every((x,i)=>i===si?true:x.committed);
        if(!allDone)setTimer({id:Date.now(),left:restDefault,total:restDefault});
        else if(!isGuest){setTimer(null);
          if(act.exIndex<act.exercises.length-1)setTimeout(()=>setAct(a=>a?{...a,exIndex:a.exIndex+1}:a),450);}
        else setTimer(null);
      };
      const stepWeight=(si,d)=>update(e=>{e[KEY][si].weight=Math.max(0,+(e[KEY][si].weight+d).toFixed(2));return e;});
      const stepReps=(si,d)=>update(e=>{e[KEY][si].reps=Math.max(1,(e[KEY][si].reps||0)+d);return e;});
      const addSet=()=>update(e=>{const arr=e[KEY];const last=arr[arr.length-1];arr.push({...last,committed:false});return e;});
      const skipEx=()=>{setTimer(null);if(act.exIndex<act.exercises.length-1)setAct(a=>({...a,exIndex:a.exIndex+1}));else setConfirmEnd(true);};
      const addExercise=name=>{
        const p=suggestNext(name,act.type,sessions,{mode:act.mode==="volume"?"volume":"normal"});
        const mk=()=>Array.from({length:p.sets||t.defSets},()=>({ghostWeight:p.weight,ghostReps:p.reps,weight:p.weight,reps:p.reps,unit:p.unit,committed:false}));
        setAct(a=>({...a,exercises:[...a.exercises,{name,cue:STRETCH_CUES[name]||null,tag:p.tag,reason:p.reason,
          sets:mk(),gsets:a.guestName?mk():undefined}],exIndex:a.exercises.length}));
        setPicking(false);
      };
      const committedCount=act.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.committed).length,0);
      const guestCount=act.exercises.reduce((n,e)=>n+(e.gsets||[]).filter(s=>s.committed).length,0);
      const activeIdx=curSets.findIndex(s=>!s.committed);
      const fmtT=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;

      return(
        <div style={{padding:"26px 22px 30px",display:"flex",flexDirection:"column",gap:20,flex:1,minHeight:"100vh"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <button onClick={()=>setConfirmEnd(true)} style={{fontSize:15,color:T.roseEye,fontWeight:700,padding:"4px 0"}}>‹ {act.label}</button>
            <div style={{display:"flex",gap:5,alignItems:"center"}}>
              {act.exercises.map((e,i)=>{const done=e.sets.length&&e.sets.every(s=>s.committed);
                return <button key={i} onClick={()=>{setTimer(null);setAct(a=>({...a,exIndex:i}));}} style={{width:Math.max(10,Math.min(22,280/act.exercises.length)),height:5,borderRadius:3,background:done?T.rose:i===act.exIndex?T.roseL:T.br2,padding:0}}/>;})}
              <button onClick={()=>setOverview(true)} style={{fontSize:16,color:T.roseEye,fontWeight:800,padding:"2px 4px",lineHeight:1}}>☰</button>
            </div>
          </div>

          <div>
            <div style={{fontFamily:MONO,fontSize:12,color:T.faint,fontWeight:500,letterSpacing:".08em"}}>ÜBUNG {act.exIndex+1} VON {act.exercises.length}</div>
            <div style={{fontSize:32,fontWeight:800,color:T.ink,letterSpacing:"-.015em",marginTop:4}}>{ex.name}</div>
            <div style={{display:"flex",gap:8,marginTop:14,flexWrap:"wrap"}}>
              <span style={{background:T.roseTint,color:T.roseD,fontSize:13,fontWeight:700,padding:"7px 12px",borderRadius:11}}>Heute: {ex.sets.length}×{ex.sets[0]?.reps||"?"}{ex.tag?` · ${ex.tag}`:""}</span>
              {ex.cue&&<span style={{background:T.sageTint,color:T.sageT,fontSize:13,fontWeight:700,padding:"7px 12px",borderRadius:11}}>{ex.cue}</span>}
            </div>
            {!isGuest&&ex.reason&&<div style={{fontSize:13.5,color:T.muted,marginTop:10,lineHeight:1.5}}>{ex.reason}</div>}
            {act.guestName
              ?<div style={{display:"flex",gap:6,marginTop:12,background:"#F6ECEA",borderRadius:14,padding:4}}>
                <button onClick={()=>setAct(a=>({...a,track:"me"}))} style={{flex:1,height:36,borderRadius:11,fontSize:13.5,fontWeight:800,background:!isGuest?T.card:"transparent",color:!isGuest?T.roseD:T.muted2,boxShadow:!isGuest?"0 2px 8px -3px rgba(214,120,146,.5)":"none"}}>Diana</button>
                <button onClick={()=>setAct(a=>({...a,track:"guest"}))} style={{flex:1,height:36,borderRadius:11,fontSize:13.5,fontWeight:800,background:isGuest?T.card:"transparent",color:isGuest?GUEST.text:T.muted2,boxShadow:isGuest?"0 2px 8px -3px rgba(185,155,201,.6)":"none"}}>{act.guestName}</button>
              </div>
              :<button onClick={()=>setGuestSheet(true)} style={{marginTop:12,fontSize:13,fontWeight:700,color:GUEST.text,background:GUEST.tint,border:`1px solid ${GUEST.border}`,borderRadius:11,padding:"7px 12px"}}>+ Gast trainiert mit</button>}
          </div>

          <div style={{display:"flex",flexDirection:"column",gap:11}}>
            {curSets.map((s,si)=>{
              const isActive=si===activeIdx;
              if(s.committed)return(
                <div key={si} style={{display:"flex",alignItems:"center",gap:14,background:isGuest?`linear-gradient(90deg,${GUEST.tint},${T.bg})`:`linear-gradient(90deg,${T.roseTint2},${T.bg})`,border:`1px solid ${isGuest?GUEST.border:"#EBC9D1"}`,borderRadius:20,padding:"12px 14px",animation:"dfWarmGlow 1.4s ease"}}>
                  <div style={{width:26,textAlign:"center",fontFamily:MONO,fontWeight:700,color:T.faint}}>{si+1}</div>
                  <div style={{flex:1,fontSize:20,fontWeight:800,color:T.ink}}>{fmtW(s.weight)}{s.unit==="pS"?" pS":""} kg <span style={{color:T.ghost2,fontWeight:700}}>×</span> {s.reps}</div>
                  <button aria-label="Satz ändern" onClick={()=>update(e=>{e[KEY][si].committed=false;return e;})} style={{width:44,height:44,borderRadius:"50%",background:AC,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:22,fontWeight:800,boxShadow:`0 8px 16px -6px ${isGuest?"rgba(185,155,201,.75)":"rgba(214,120,146,.75)"}`,animation:"dfSpring .4s ease",flexShrink:0}}>✓</button>
                </div>);
              if(isActive)return(
                <div key={si} style={{display:"flex",alignItems:"center",gap:10,background:T.card,border:`2px solid ${AC}`,borderRadius:20,padding:"11px 12px"}}>
                  <div style={{width:22,textAlign:"center",fontFamily:MONO,fontWeight:700,color:T.faint}}>{si+1}</div>
                  <div style={{flex:1,display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <button onClick={()=>stepWeight(si,-incFor(ex.name))} style={{width:32,height:32,borderRadius:10,border:`1px solid ${T.br2}`,background:T.bg,fontSize:18,fontWeight:800,color:"#b58a90"}}>−</button>
                      <div style={{minWidth:70,textAlign:"center"}}>
                        <span style={{fontSize:19,fontWeight:800,color:s.weight===s.ghostWeight?T.ghost2:T.ink}}>{fmtW(s.weight)}</span>
                        <span style={{fontSize:11,color:T.ghost2,fontWeight:700}}> {s.unit==="pS"?"pS kg":s.unit}</span>
                      </div>
                      <button onClick={()=>stepWeight(si,incFor(ex.name))} style={{width:32,height:32,borderRadius:10,border:`1px solid ${T.br2}`,background:T.bg,fontSize:18,fontWeight:800,color:"#b58a90"}}>+</button>
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:5}}>
                      <button onClick={()=>stepReps(si,-1)} style={{width:28,height:28,borderRadius:9,border:`1px solid ${T.br2}`,background:T.bg,fontSize:15,fontWeight:800,color:"#b58a90"}}>−</button>
                      <span style={{fontSize:18,fontWeight:800,color:s.reps===s.ghostReps?T.ghost2:T.ink,minWidth:34,textAlign:"center"}}>×{s.reps}</span>
                      <button onClick={()=>stepReps(si,1)} style={{width:28,height:28,borderRadius:9,border:`1px solid ${T.br2}`,background:T.bg,fontSize:15,fontWeight:800,color:"#b58a90"}}>+</button>
                    </div>
                  </div>
                  <button aria-label="Satz abhaken" onClick={()=>commitSet(si)} style={{width:44,height:44,borderRadius:"50%",border:`2px solid ${AC}`,display:"flex",alignItems:"center",justifyContent:"center",color:AC,fontSize:20,fontWeight:800,flexShrink:0}}>✓</button>
                </div>);
              return(
                <div key={si} onClick={()=>commitSet(si)} style={{display:"flex",alignItems:"center",gap:14,background:"#F7EEEC",border:`1px dashed ${T.brDash}`,borderRadius:20,padding:"12px 14px",opacity:.75}}>
                  <div style={{width:26,textAlign:"center",fontFamily:MONO,fontWeight:700,color:T.ghost2}}>{si+1}</div>
                  <div style={{flex:1,fontSize:19,fontWeight:700,color:T.ghost}}>{fmtW(s.weight)}{s.unit==="pS"?" pS":""} kg <span style={{color:"#dbc9c5"}}>×</span> {s.reps}</div>
                  <div style={{width:44,height:44,borderRadius:"50%",border:"2px dashed #e2ccc6",display:"flex",alignItems:"center",justifyContent:"center",color:"#d3bcb7",fontSize:20,fontWeight:800}}>✓</div>
                </div>);

            <div style={{display:"flex",gap:10}}>
              <button onClick={addSet} style={{flex:1,padding:"11px 0",borderRadius:14,border:`1.5px dashed ${T.brDash}`,color:T.muted2,fontSize:13.5,fontWeight:700}}>+ Satz</button>
              <button onClick={skipEx} style={{flex:1,padding:"11px 0",borderRadius:14,border:`1.5px dashed ${T.brDash}`,color:T.muted2,fontSize:13.5,fontWeight:700}}>Übung überspringen</button>
            </div>
            <button onClick={()=>setPicking(true)} style={{padding:"11px 0",borderRadius:14,border:`1.5px dashed ${T.brDash}`,color:T.muted2,fontSize:13.5,fontWeight:700}}>+ Übung hinzufügen</button>
          </div>

          <div style={{marginTop:"auto",display:"flex",flexDirection:"column",gap:10}}>
            {timer&&<div style={{display:"flex",alignItems:"center",gap:12,background:T.ink,borderRadius:22,padding:"14px 16px",color:T.bg}}>

              <div style={{flex:1}}>
                <div style={{fontSize:11,letterSpacing:".1em",textTransform:"uppercase",color:T.muted2,fontWeight:700}}>Pause läuft</div>
                <div style={{fontFamily:MONO,fontSize:24,fontWeight:700,marginTop:1}}>{fmtT(timer.left)}</div>
              </div>
              <button onClick={()=>setTimer(tm=>tm?{...tm,left:Math.max(1,tm.left-15)}:null)} style={{width:44,height:40,borderRadius:12,background:"#4c3b3e",color:T.bg,fontWeight:700,fontSize:13}}>−15</button>
              <button onClick={()=>setTimer(tm=>tm?{...tm,left:tm.left+15}:null)} style={{width:44,height:40,borderRadius:12,background:"#4c3b3e",color:T.bg,fontWeight:700,fontSize:13}}>+15</button>
              <button onClick={()=>setTimer(null)} style={{width:34,height:40,borderRadius:12,background:"#4c3b3e",color:T.muted2,fontWeight:700,fontSize:13}}>✕</button>
            </div>}
            {committedCount>0&&<button onClick={()=>onFinish(act)} style={{width:"100%",height:54,borderRadius:16,background:T.ink,color:T.bg,fontSize:15,fontWeight:700}}>Workout beenden · {committedCount} Sätze{guestCount>0?` · ${act.guestName} ${guestCount}`:""}</button>}
          </div>

          {pr&&<PROverlay pr={pr} line={PR_LINES[(act.id||"").split("").reduce((n,c)=>n+c.charCodeAt(0),0)%PR_LINES.length]} onClose={()=>setPr(null)}/>}
          {picking&&<ExPicker type={act.type} sessions={sessions} existing={act.exercises.map(e=>e.name)} onPick={addExercise} onClose={()=>setPicking(false)}/>}
          {overview&&<Sheet onClose={()=>setOverview(false)}>
            <div style={{fontSize:20,fontWeight:800,color:T.ink,marginBottom:2}}>Heute im Plan</div>
            <div style={{fontSize:13,color:T.muted,marginBottom:16}}>Antippen zum Springen. Ziehen am ⠿ oder Pfeile: Reihenfolge ändern, gilt auch fürs nächste Mal.</div>
            <div style={{display:"flex",flexDirection:"column",gap:7}}>
              {act.exercises.map((e,i)=>{
                const done=e.sets.filter(s=>s.committed).length;
                const isCur=i===act.exIndex;
                const isDrag=drag&&drag.i===i;
                return(
                  <div key={e.name} data-row style={{display:"flex",alignItems:"center",gap:8,...CARD,borderRadius:14,padding:"10px 12px",
                    border:isDrag?`2px solid ${T.roseL}`:isCur?`2px solid ${T.rose}`:CARD.border,
                    transform:isDrag?`translateY(${drag.dy}px) scale(1.02)`:"none",
                    boxShadow:isDrag?"0 10px 24px -8px rgba(120,60,80,.35)":"none",
                    zIndex:isDrag?2:1,position:"relative",transition:isDrag?"none":"transform .15s ease"}}>
                    <div style={{display:"flex",flexDirection:"column",gap:2,flexShrink:0}}>
                      <button onClick={()=>moveEx(i,-1)} style={{fontSize:15,lineHeight:1,color:i===0?T.br2:T.muted,padding:"2px 5px"}}>↑</button>
                      <button onClick={()=>moveEx(i,1)} style={{fontSize:15,lineHeight:1,color:i===act.exercises.length-1?T.br2:T.muted,padding:"2px 5px"}}>↓</button>
                    </div>
                    <button onClick={()=>{setTimer(null);setAct(a=>({...a,exIndex:i}));setOverview(false);}} style={{flex:1,display:"flex",justifyContent:"space-between",alignItems:"center",textAlign:"left",gap:8,minWidth:0}}>
                      <div style={{minWidth:0}}>
                        <div style={{fontSize:14.5,fontWeight:700,color:T.ink,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.name}</div>
                        {isCur&&<div style={{fontSize:11.5,color:T.roseEye,fontWeight:600}}>gerade offen</div>}
                      </div>
                      <span style={{fontFamily:MONO,fontSize:13,fontWeight:700,color:done===e.sets.length&&done>0?T.sageT:done>0?T.roseD:T.faint,flexShrink:0}}>{done}/{e.sets.length}</span>
                    </button>
                    <span
                      onPointerDown={ev=>{ev.preventDefault();ev.currentTarget.setPointerCapture(ev.pointerId);

                        setDrag({i,y:ev.clientY,dy:0,h:(row?row.offsetHeight:56)+7});}}
                      onPointerMove={ev=>{
                        if(!drag)return;
                        const dy=ev.clientY-drag.y;
                        if(dy>drag.h*0.55&&drag.i<act.exercises.length-1){moveEx(drag.i,1);setDrag({...drag,i:drag.i+1,y:ev.clientY,dy:0});}
                        else if(dy<-drag.h*0.55&&drag.i>0){moveEx(drag.i,-1);setDrag({...drag,i:drag.i-1,y:ev.clientY,dy:0});}
                        else setDrag({...drag,dy});}}
                      onPointerUp={()=>setDrag(null)}

                      style={{touchAction:"none",cursor:isDrag?"grabbing":"grab",userSelect:"none",WebkitUserSelect:"none",fontSize:17,color:T.faint,padding:"10px 6px",flexShrink:0,lineHeight:1}}>⠿</span>
                  </div>);})}

          {guestSheet&&<GuestSheet onSave={addGuest} onClose={()=>setGuestSheet(false)}/>}
          {confirmEnd&&<Sheet onClose={()=>setConfirmEnd(false)}>

              {committedCount>0&&<button onClick={()=>onFinish(act)} style={{flex:1,height:50,borderRadius:14,background:T.ink,color:T.bg,fontSize:15,fontWeight:700}}>Speichern</button>}

    }

    const PR_LINES=["Einfach so.","Stärker als letzte Woche. Wie bestellt.","Niemand hat geklatscht. Zählt trotzdem.","Das Protokoll freut sich still.","Die Maschine muss jetzt damit leben.","Notiert. Für die Ewigkeit.","Rekord. Kein großes Ding. Doch.","Sauber. Weiter im Text."];
    function PROverlay({pr,line,onClose}){

              <span style={{color:"#fff",fontSize:30}}>★</span>
            </div>

    }

    // ══ SUMMARY (2d) ══════════════════════════════════════════════════════
    function Summary({session,sessions,onDone}){
      const today=localDate();
      const setsDone=session.exercises.reduce((n,e)=>n+e.sets.length,0);
      const prev=byDateDesc(sessions).find(s=>s.id!==session.id&&normType(s.type)===normType(session.type)&&isTraining(normType(s.type)));
      const comps=useMemo(()=>{
        if(!prev)return[];
        return session.exercises.map(ex=>{
          const pe=prev.exercises?.find(e=>e.name===ex.name); if(!pe)return null;
          const b=bestSet(ex),pb=bestSet(pe);
          const dW=+(b.weight-pb.weight).toFixed(2), dR=(b.reps||0)-(pb.reps||0);
          if(dW>0)return{name:ex.name,txt:`+${fmtW(dW)} kg ↑`,good:true};
          if(dW===0&&dR>0)return{name:ex.name,txt:`+${dR} Wdh`,good:false};
          return null;
        }).filter(Boolean).slice(0,4);
      },[session]);
      const wg=weeklyGoal(sessions,today);
      const ring=163-163*Math.min(1,wg.done/wg.goal);
      const prs=useMemo(()=>{ // pro Übung nur der beste PR
        const m={};(session.prs||[]).forEach(p=>{if(!m[p.exercise]||p.value>m[p.exercise].value)m[p.exercise]=p;});
        return Object.values(m);
      },[session]);
      const TITLES=["Sauber durchgezogen.","Erledigt. Wie immer.","Solide Arbeit, keine Show.","Feierabend im Gym.","Kurz, effektiv, fertig.","Das Soll sagt danke."];
      const seed=(session.id||"").split("").reduce((n,c)=>n+c.charCodeAt(0),0);
      const title=session.mode==="volume"?"Müder Tag, trotzdem geliefert.":TITLES[seed%TITLES.length];
      // Tonnage: pS zählt pro Seite, also x2
      const tonnage=useMemo(()=>session.exercises.reduce((sum,e)=>sum+e.sets.reduce((s2,x)=>x.unit==="min"?s2:s2+(x.weight||0)*(x.reps||0)*(x.unit==="pS"?2:1),0),0),[session]);
      const tonLine=useMemo(()=>{
        if(!tonnage)return null;
        const t=(tonnage/1000).toFixed(1).replace(".",",");
        if(tonnage<1000)return `${fmtW(tonnage)} kg bewegt. Klingt wenig, war es nicht.`;
        if(tonnage<3000)return `${t} Tonnen bewegt. Ein Kleinwagen. Ungefähr.`;
        if(tonnage<5000)return `${t} Tonnen bewegt. Ein Nashorn hätte Respekt.`;
        return `${t} Tonnen bewegt. Der Aufzug hätte das nicht geschafft.`;
      },[tonnage]);

      const shareCard=()=>{
        const c=document.createElement("canvas");c.width=600;c.height=600;const x=c.getContext("2d");
        const g=x.createLinearGradient(0,0,600,600);g.addColorStop(0,"#E48DA3");g.addColorStop(1,"#c25f7b");
        x.fillStyle=g;x.beginPath();x.roundRect(0,0,600,600,56);x.fill();
        x.fillStyle="#FCEEF0";x.font="800 26px 'Hanken Grotesk'";x.fillText("Diana Fit",56,80);
        x.font="500 20px 'JetBrains Mono'";x.globalAlpha=.8;x.textAlign="right";x.fillText(fmtDate(session.date),544,80);x.textAlign="left";x.globalAlpha=1;
        let y=300;
        if(prs.length){
          x.font="700 22px 'Hanken Grotesk'";x.globalAlpha=.85;x.fillText("NEUER REKORD",56,y-90);x.globalAlpha=1;
          x.font="800 100px 'Hanken Grotesk'";x.fillText(`${fmtW(prs[0].value)} kg`,52,y+10);
          x.font="italic 500 34px 'Newsreader'";x.globalAlpha=.95;x.fillText(`${prs[0].exercise}. Einfach so.`,56,y+66);x.globalAlpha=1;
        }else{
          x.font="700 22px 'Hanken Grotesk'";x.globalAlpha=.85;x.fillText(session.label.toUpperCase(),56,y-90);x.globalAlpha=1;
          x.font="800 100px 'Hanken Grotesk'";x.fillText(`${setsDone}`,52,y+10);
          x.font="italic 500 34px 'Newsreader'";x.globalAlpha=.95;x.fillText("Sätze. Sauber durchgezogen.",56,y+66);x.globalAlpha=1;
        }
        x.font="500 24px 'Hanken Grotesk'";x.globalAlpha=.9;
        x.fillText(`${session.duration} min   ·   ${setsDone} Sätze   ·   ${wg.done}/${wg.goal} Woche`,56,540);x.globalAlpha=1;
        const a=document.createElement("a");a.href=c.toDataURL("image/png");a.download=`dianafit-${session.date}.png`;a.click();
      };

      return(
        <div style={{padding:"28px 22px 30px",display:"flex",flexDirection:"column",gap:20,flex:1,minHeight:"100vh",animation:"dfUp .2s ease"}}>
          <div>
            <div style={{...EYEBROW,letterSpacing:".14em"}}>Geschafft · {session.label}</div>
            <div style={{fontSize:30,fontWeight:800,color:T.ink,letterSpacing:"-.01em",marginTop:4}}>{title}</div>
            {tonLine&&<div style={{fontFamily:SERIF,fontStyle:"italic",fontSize:16,color:"#7a5a60",marginTop:6}}>{tonLine}</div>}
            {session.guest&&<div style={{fontFamily:SERIF,fontStyle:"italic",fontSize:15,color:"#a2908d",marginTop:4}}>Mit {session.guest.name}. Die Gast-Sätze zählen nicht in deine Kurve.</div>}
          </div>
          <div style={{display:"flex",gap:12}}>
            <div style={{flex:1,...CARD,borderRadius:20,padding:16}}>
              <div style={{fontFamily:MONO,fontSize:11,letterSpacing:".08em",color:T.faint,fontWeight:700}}>DAUER</div>
              <div style={{fontSize:30,fontWeight:800,color:T.ink,marginTop:4}}>{session.duration}<span style={{fontSize:15,color:T.muted2,fontWeight:700}}>min</span></div>
            </div>
            <div style={{flex:1,...CARD,borderRadius:20,padding:16}}>
              <div style={{fontFamily:MONO,fontSize:11,letterSpacing:".08em",color:T.faint,fontWeight:700}}>SÄTZE</div>
              <div style={{fontSize:30,fontWeight:800,color:T.ink,marginTop:4}}>{setsDone}</div>
            </div>
          </div>
          {prs.length>0&&<div style={{background:`linear-gradient(155deg,${T.rose},${T.roseD})`,borderRadius:22,padding:"18px 20px",color:"#FCEEF0",display:"flex",alignItems:"center",gap:14}}>
            <span style={{width:44,height:44,borderRadius:"50%",background:"rgba(255,255,255,.18)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>★</span>
            <div>
              <div style={{fontSize:12,letterSpacing:".1em",textTransform:"uppercase",opacity:.85,fontWeight:700}}>{prs.length===1?"1 neuer Rekord":`${prs.length} neue Rekorde`}</div>
              <div style={{fontSize:20,fontWeight:800,marginTop:1}}>{prs[0].exercise} · {fmtW(prs[0].value)}{prs[0].unit==="pS"?" pS":""} kg{prs[0].kind==="e1rm"?" e1RM":""}</div>
            </div>
          </div>}
          {comps.length>0&&<div style={{...CARD,borderRadius:20,padding:"16px 18px",display:"flex",flexDirection:"column",gap:12}}>
            <div style={{fontSize:13,color:"#8a7a77",fontWeight:600}}>Gegenüber letztem {normType(session.type)==="glute_heavy"?"Glute-Tag":"Oberkörper-Tag"}</div>
            {comps.map(c=>(
              <div key={c.name} style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <span style={{fontSize:15,fontWeight:700,color:T.t2}}>{c.name}</span>
                <span style={{fontFamily:MONO,fontSize:15,fontWeight:700,color:c.good?T.sageT:T.muted}}>{c.txt}</span>
              </div>))}
          </div>}
          <div style={{display:"flex",alignItems:"center",gap:16,...CARD,borderRadius:20,padding:"16px 18px"}}>
            <div style={{position:"relative",width:62,height:62,flexShrink:0}}>
              <svg width="62" height="62" viewBox="0 0 62 62">
                <circle cx="31" cy="31" r="26" fill="none" stroke={T.br} strokeWidth="8"/>
                <circle cx="31" cy="31" r="26" fill="none" stroke={T.rose} strokeWidth="8" strokeLinecap="round" strokeDasharray="163" strokeDashoffset={ring} transform="rotate(-90 31 31)"/>
              </svg>
              <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:MONO,fontSize:14,fontWeight:700,color:T.ink}}>{wg.done}/{wg.goal}</div>
            </div>
            <div style={{flex:1}}>
              <div style={{fontSize:15,fontWeight:700,color:T.t2}}>Wochenziel</div>
              <div style={{fontSize:13,color:T.muted,marginTop:2}}>{wg.done>=wg.goal?"Voll. Der Rest der Woche gehört dir.":"Noch "+(wg.goal-wg.done)+" Einheit"+(wg.goal-wg.done===1?"":"en")+", wenn du magst. Kein Muss."}</div>
            </div>
          </div>
          <div style={{marginTop:"auto",display:"flex",gap:12}}>
            <button onClick={shareCard} style={{flex:1,height:52,border:`1px solid ${T.brDash}`,borderRadius:16,color:T.roseD,fontSize:15,fontWeight:700}}>Als Bild teilen</button>
            <button onClick={onDone} style={{flex:1,height:52,borderRadius:16,background:T.ink,color:T.bg,fontSize:15,fontWeight:700}}>Fertig</button>
          </div>
        </div>
      );
    }

    // ══ PROGRESS (2e) ═════════════════════════════════════════════════════
    function Progress({sessions,del,onBack}){
      const today=localDate();
      const heroCandidates=useMemo(()=>{
        const freq={};
        sessions.forEach(s=>{if(!isTraining(normType(s.type)))return;s.exercises?.forEach(e=>{if(e.sets?.some(x=>x.unit!=="min"&&x.weight>0&&x.reps))freq[e.name]=(freq[e.name]||0)+1;});});
        return Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([n])=>n);
      },[sessions]);
      const [hero,setHero]=useState(null);
      const heroName=hero||heroCandidates[0]||"Hip Thrust Elite";
      const trend=e1rmTrend(heroName,sessions);
      const cur=trend.length?trend[trend.length-1].v:0;
      const delta=trend.length>1?Math.round((cur-trend[0].v)/trend[0].v*100):0;
      const ws=weeklySets(sessions,today);
      const [confDel,setConfDel]=useState(null);
      const [open,setOpen]=useState(null);
      const [showAll,setShowAll]=useState(false);

      const path=useMemo(()=>{
        if(trend.length<2)return null;
        const W=300,H=110,p=8;
        const vs=trend.map(t=>t.v);const mn=Math.min(...vs),mx=Math.max(...vs),rng=mx-mn||1;
        const pts=vs.map((v,i)=>[p+(i/(vs.length-1))*(W-2*p),H-18-((v-mn)/rng)*(H-40)]);
        const line=pts.map((pt,i)=>`${i?"L":"M"}${pt[0].toFixed(1)},${pt[1].toFixed(1)}`).join(" ");
        return{line,area:`${line} L${pts[pts.length-1][0]},${H-6} L${pts[0][0]},${H-6} Z`,last:pts[pts.length-1]};
      },[trend]);

      // Kalender-Heatmap: 1 Spalte = 1 Woche (Mo oben, So unten), letzte 26 Wochen
      const heat=useMemo(()=>{
        const map={};
        sessions.forEach(s=>{if(!s.date)return;
          map[s.date]=map[s.date]==="strength"?"strength":(isTraining(normType(s.type))?"strength":(map[s.date]||"kurs"));});
        const now=new Date();
        const monday=new Date(now);monday.setDate(monday.getDate()-((monday.getDay()+6)%7));
        const start=new Date(monday);start.setDate(start.getDate()-25*7);
        const weeks=[];const monthAt={};let lastMonth=-1;
        for(let w=0;w<26;w++){
          const wkStart=new Date(start);wkStart.setDate(start.getDate()+w*7);
          if(wkStart.getMonth()!==lastMonth){monthAt[w]=wkStart.toLocaleDateString("de-DE",{month:"short"});lastMonth=wkStart.getMonth();}
          const col=[];
          for(let d=0;d<7;d++){const day=new Date(wkStart);day.setDate(wkStart.getDate()+d);
            col.push({k:localDate(day),kind:map[localDate(day)]||null,future:day>now});}
          weeks.push(col);
        }
        return{weeks,monthAt};
      },[sessions]);

      const prList=useMemo(()=>{
        return heroCandidates.slice(0,5).map(name=>{
          let best=null;
          sessions.forEach(s=>s.exercises?.forEach(e=>{if(e.name!==name)return;(e.sets||[]).forEach(x=>{if(x.unit==="min")return;if(!best||(x.weight||0)>best.w){best={w:x.weight,unit:x.unit,date:s.date};}});}));
          if(!best)return null;
          const wk=Math.floor(daysBetween(best.date,today)/7);
          const fresh=daysBetween(best.date,today)<=1;
          const stag=wk>=4;
          return{name,w:best.w,unit:best.unit,sub:fresh?"heute · frisch":wk<1?"diese Woche":stag?`stagniert · ${wk} Wochen`:`vor ${wk} Woche${wk===1?"":"n"}`,fresh,stag};
        }).filter(Boolean);
      },[sessions]);

      const sList=byDateDesc(sessions);
      const visible=showAll?sList:sList.slice(0,6);

      return(
        <div style={{padding:"26px 22px 30px",display:"flex",flexDirection:"column",gap:22,flex:1,animation:"dfUp .18s ease"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <button onClick={onBack} style={{fontSize:15,color:T.roseEye,fontWeight:700}}>‹ Heute</button>
          </div>
          <div>
            <div style={{...EYEBROW,letterSpacing:".14em"}}>Fortschritt</div>
            <div style={{fontSize:30,fontWeight:800,color:T.ink,letterSpacing:"-.01em",marginTop:4}}>{delta>0?"Die Kurve zeigt hoch.":"Dranbleiben zählt."}</div>
          </div>

          <div style={{...CARD,padding:"18px 18px 14px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:12}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:14,fontWeight:800,color:T.ink,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{heroName} · e1RM</div>
                <div style={{fontSize:12,color:T.muted2,marginTop:1}}>letzte {trend.length} Sessions</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:24,fontWeight:800,color:T.roseD,lineHeight:1}}>{fmtW(cur)}<span style={{fontSize:12,color:T.muted2}}> kg</span></div>
                {trend.length>1&&<div style={{fontFamily:MONO,fontSize:11,color:delta>=0?T.sageT:T.amberT,fontWeight:700}}>{delta>=0?"+":""}{delta}% {delta>=0?"↑":"↓"}</div>}
              </div>
            </div>
            {path?<svg viewBox="0 0 300 110" width="100%" height="110" style={{marginTop:8,display:"block"}}>
              <defs><linearGradient id="dfArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor={T.rose} stopOpacity=".28"/><stop offset="1" stopColor={T.rose} stopOpacity="0"/></linearGradient></defs>
              <path d={path.area} fill="url(#dfArea)"/>
              <path d={path.line} fill="none" stroke={T.rose} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" strokeDasharray="620" style={{animation:"dfDraw 1.4s ease both"}}/>
              <circle cx={path.last[0]} cy={path.last[1]} r="5" fill={T.roseD} stroke={T.card} strokeWidth="2.5"/>
            </svg>:<div style={{padding:"26px 0 18px",fontSize:13,color:T.muted2,textAlign:"center"}}>Noch zu wenig Daten für eine Kurve.</div>}
            {heroCandidates.length>1&&<div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:6}}>
              {heroCandidates.map(n=><button key={n} onClick={()=>setHero(n)} style={{padding:"5px 10px",borderRadius:10,fontSize:12,fontWeight:700,background:n===heroName?T.roseTint:"transparent",color:n===heroName?T.roseD:T.faint,border:`1px solid ${n===heroName?"#EBC9D1":T.br2}`}}>{n.split(" ")[0]}</button>)}
            </div>}
          </div>

          <div style={{...CARD,padding:18}}>
            <div style={{fontSize:14,fontWeight:800,color:T.ink}}>Sätze pro Muskelgruppe</div>
            <div style={{fontSize:12,color:T.muted2,marginTop:1,marginBottom:14}}>diese Woche · Zielkorridor grau</div>
            <div style={{display:"flex",flexDirection:"column",gap:13}}>
              {Object.entries(VOLUME_TARGETS).map(([m,[lo,hi]])=>{
                const v=ws[m]||0;const max=Math.max(hi*1.25,v,1);
                const inCorr=v>=lo;const col=inCorr?T.rose:T.amber;const txtCol=inCorr?T.sageT:T.amberT;
                return(<div key={m}>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:12.5,fontWeight:700,color:T.t2,marginBottom:5}}>
                    <span>{m}</span><span style={{fontFamily:MONO,color:txtCol}}>{v} · Ziel {lo}-{hi}</span>
                  </div>
                  <div style={{position:"relative",height:12,borderRadius:6,background:T.track}}>
                    <div style={{position:"absolute",left:`${lo/max*100}%`,right:`${100-hi/max*100}%`,top:0,bottom:0,background:T.corridor,borderRadius:6}}/>
                    <div style={{position:"absolute",left:0,top:0,bottom:0,width:`${Math.min(100,v/max*100)}%`,background:col,borderRadius:6,transition:"width .4s ease"}}/>
                  </div>
                </div>);})}
            </div>
          </div>

          <div style={{...CARD,padding:18}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontSize:14,fontWeight:800,color:T.ink}}>Konstanz</span>
              <div style={{display:"flex",alignItems:"center",gap:10,fontSize:11,color:T.muted2}}>
                <span style={{display:"flex",alignItems:"center",gap:4}}><span style={{width:9,height:9,borderRadius:2,background:T.rose}}/>Kraft</span>
                <span style={{display:"flex",alignItems:"center",gap:4}}><span style={{width:9,height:9,borderRadius:2,background:T.sage}}/>Kurs</span>
              </div>
            </div>
            <div style={{fontSize:12,color:T.muted2,marginTop:1,marginBottom:12}}>letzte 26 Wochen · 1 Spalte = 1 Woche, Mo oben</div>
            <div style={{display:"flex",gap:3}}>
              <div style={{display:"grid",gridTemplateRows:"repeat(7,1fr)",gap:3,width:16,flexShrink:0}}>
                {["Mo","","Mi","","Fr","","So"].map((d,i)=><span key={i} style={{fontSize:8,color:T.faint,fontWeight:700,display:"flex",alignItems:"center"}}>{d}</span>)}
              </div>
              {heat.weeks.map((col,wi)=>(
                <div key={wi} style={{display:"flex",flexDirection:"column",gap:3,flex:1}}>
                  {col.map(c=><span key={c.k} title={c.k} style={{aspectRatio:"1",borderRadius:2,background:c.future?"transparent":c.kind==="strength"?T.rose:c.kind==="kurs"?T.sage:T.track}}/>)}
                </div>))}
            </div>
            <div style={{display:"flex",gap:3,marginTop:4}}>
              <span style={{width:16,flexShrink:0}}/>
              {heat.weeks.map((c,wi)=><span key={wi} style={{flex:1,fontSize:8.5,color:T.muted2,fontWeight:700,whiteSpace:"nowrap",overflow:"visible"}}>{heat.monthAt[wi]||""}</span>)}
            </div>
          </div>

          {prList.length>0&&<div>
            <div style={{fontSize:14,fontWeight:800,color:T.ink,marginBottom:10}}>Persönliche Rekorde</div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {prList.map(p=>(
                <div key={p.name} style={{display:"flex",alignItems:"center",justifyContent:"space-between",...CARD,borderRadius:16,padding:"13px 16px"}}>
                  <div><div style={{fontSize:15,fontWeight:700,color:T.ink}}>{p.name}</div><div style={{fontSize:12,color:T.muted2}}>{p.sub}</div></div>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:16,fontWeight:800,color:p.fresh?T.roseD:p.stag?T.muted:T.t2}}>{fmtW(p.w)}{p.unit==="pS"?" pS":""} kg</span>
                    {p.fresh&&<span style={{width:8,height:8,borderRadius:"50%",background:T.rose}}/>}
                  </div>
                </div>))}
            </div>
          </div>}

          <div>
            <div style={{fontSize:14,fontWeight:800,color:T.ink,marginBottom:10}}>Verlauf</div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {visible.map(s=>{const nt=normType(s.type);const isOpen=open===s.id;
                return(<div key={s.id} style={{...CARD,borderRadius:16,overflow:"hidden"}}>
                  <button onClick={()=>setOpen(isOpen?null:s.id)} style={{width:"100%",padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",textAlign:"left"}}>
                    <div style={{display:"flex",gap:12,alignItems:"center"}}>
                      <span style={{width:3,height:32,borderRadius:2,background:nt==="other"?T.sage:T.rose,flexShrink:0}}/>
                      <div>
                        <div style={{fontSize:14.5,fontWeight:700,color:T.ink}}>{s.label||getType(nt).label}</div>
                        <div style={{fontSize:12,color:T.muted2,marginTop:1}}>{nt==="other"?`${s.duration||s.exercises?.[0]?.sets?.[0]?.weight||"?"} min`:`${s.exercises?.length||0} ${(s.exercises?.length||0)===1?"Übung":"Übungen"}`}</div>
                      </div>
                    </div>
                    <span style={{fontFamily:MONO,fontSize:12.5,color:T.t2,fontWeight:600}}>{fmtDate(s.date)}</span>
                  </button>
                  {isOpen&&<div style={{borderTop:`1px solid ${T.br}`,padding:"6px 16px 12px"}}>
                    {nt!=="other"&&s.exercises?.map((ex,i)=>(
                      <div key={i} style={{padding:"7px 0",borderBottom:"1px solid #F6EAE7",display:"flex",justifyContent:"space-between"}}>
                        <span style={{fontSize:13.5,color:T.ink,fontWeight:600}}>{ex.name}</span>
                        <span style={{fontFamily:MONO,fontSize:12.5,color:T.roseD,fontWeight:600}}>
                          {ex.sets?.[0]?.unit==="min"?`${ex.sets[0].weight} min`:ex.sets?.map(x=>x.reps).join("/")+" @ "+fmtW(bestSet(ex).weight||0)+(ex.sets?.[0]?.unit==="pS"?" pS":"")}
                        </span>
                      </div>))}
                    <div style={{marginTop:10}}>
                      {confDel===s.id
                        ?<div style={{display:"flex",gap:8,alignItems:"center"}}>
                          <span style={{fontSize:13,color:T.t2,flex:1}}>Wirklich löschen?</span>
                          <button onClick={()=>{del(s.id);setConfDel(null);setOpen(null);}} style={{background:"#A03020",color:"#fff",borderRadius:8,padding:"7px 16px",fontSize:13,fontWeight:700}}>Ja</button>
                          <button onClick={()=>setConfDel(null)} style={{background:T.roseTint,color:T.t2,borderRadius:8,padding:"7px 16px",fontSize:13,fontWeight:600}}>Nein</button>
                        </div>
                        :<button onClick={()=>setConfDel(s.id)} style={{color:T.muted2,fontSize:12.5,textDecoration:"underline",textUnderlineOffset:3,fontWeight:500}}>Session löschen</button>}
                    </div>
                  </div>}
                </div>);})}
            </div>
            {sList.length>6&&<button onClick={()=>setShowAll(x=>!x)} style={{width:"100%",padding:12,marginTop:8,borderRadius:14,border:`1px solid ${T.br2}`,color:T.t2,fontSize:13.5,fontWeight:600}}>{showAll?"Weniger anzeigen":`Alle ${sList.length} anzeigen`}</button>}
          </div>
        </div>
      );
    }

    // ══ SHEETS ════════════════════════════════════════════════════════════
    function Sheet({children,onClose}){
      return(
        <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(43,36,38,.45)",zIndex:150,display:"flex",flexDirection:"column",backdropFilter:"blur(3px)"}}>
          <div style={{flex:1}}/>
          <div onClick={e=>e.stopPropagation()} style={{background:T.card,borderRadius:"24px 24px 0 0",padding:"24px 20px 40px",boxShadow:"0 -8px 32px rgba(120,60,80,.25)",maxWidth:430,width:"100%",margin:"0 auto",maxHeight:"82vh",overflowY:"auto"}}>
            {children}
          </div>
        </div>);
    }

    function GuestSheet({onSave,onClose}){
      const [name,setName]=useState("");
      return(
        <Sheet onClose={onClose}>
          <div style={{fontSize:22,fontWeight:800,color:T.ink,marginBottom:2}}>Gast trainiert mit</div>
          <div style={{fontSize:13.5,color:T.muted,marginBottom:18}}>Eigene Spur, eigene Gewichte. Deine Statistik bleibt unberührt.</div>
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="Name, z.B. Sophia" autoFocus
            style={{width:"100%",padding:"13px 15px",borderRadius:14,border:"1.5px solid #E0D0E8",background:"#FDFBFE",fontSize:15.5,color:T.ink,marginBottom:16}}/>
          <button disabled={!name.trim()} onClick={()=>onSave(name.trim())}
            style={{width:"100%",height:52,borderRadius:15,background:name.trim()?"#B99BC9":"#EBE2F0",color:name.trim()?"#fff":"#b9a8c4",fontSize:15.5,fontWeight:800}}>Los geht's</button>
        </Sheet>);
    }

    function KursSheet({onSave,onClose}){
      const [name,setName]=useState(null);
      const [mins,setMins]=useState(45);
      const [custom,setCustom]=useState("");
      return(
        <Sheet onClose={onClose}>
          <div style={{fontSize:22,fontWeight:800,color:T.ink,marginBottom:2}}>Kurs & Co</div>
          <div style={{fontSize:13.5,color:T.muted,marginBottom:18}}>Nur fürs Protokoll. Kein Gewicht, kein Druck.</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:16}}>
            {OTHER_EX.map(n=>(
              <button key={n} onClick={()=>setName(n)} style={{padding:"11px 6px",borderRadius:13,fontSize:13,fontWeight:700,background:name===n?T.sage:T.sageTint,color:name===n?"#fff":T.sageT,boxShadow:name===n?"0 6px 14px -6px rgba(166,181,142,.7)":"none"}}>{n}</button>))}
          </div>
          <input value={custom} onChange={e=>{setCustom(e.target.value);if(e.target.value)setName(e.target.value);}} placeholder="Oder eigenen Namen tippen …" style={{width:"100%",padding:"12px 14px",borderRadius:13,border:`1.5px solid ${T.br2}`,background:T.bg,fontSize:14.5,marginBottom:16,color:T.ink}}/>
          <div style={{fontSize:13,fontWeight:700,color:T.t2,marginBottom:8}}>Dauer</div>
          <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:22}}>
            {[30,45,60,90].map(m=><button key={m} onClick={()=>setMins(m)} style={{flex:1,height:40,borderRadius:12,fontWeight:700,fontSize:14,background:mins===m?T.sage:"#F6E4E1",color:mins===m?"#fff":"#cdb0ad"}}>{m}</button>)}
            <div style={{display:"flex",alignItems:"center",gap:5}}>
              <button onClick={()=>setMins(m=>Math.max(5,m-5))} style={{width:32,height:32,borderRadius:10,border:`1px solid ${T.br2}`,background:T.bg,fontWeight:800,color:"#b58a90"}}>−</button>
              <span style={{fontFamily:MONO,fontSize:15,fontWeight:700,minWidth:34,textAlign:"center",color:T.ink}}>{mins}</span>
              <button onClick={()=>setMins(m=>m+5)} style={{width:32,height:32,borderRadius:10,border:`1px solid ${T.br2}`,background:T.bg,fontWeight:800,color:"#b58a90"}}>+</button>
            </div>
          </div>
          <button disabled={!name} onClick={()=>onSave(name,mins)} style={{width:"100%",height:54,borderRadius:16,background:name?T.sage:"#E7EDDD",color:name?"#fff":"#b9c4a6",fontSize:16,fontWeight:800}}>Loggen ✓</button>
        </Sheet>);
    }

    function ExPicker({type,sessions,existing,onPick,onClose}){
      const pool=(normType(type)==="glute_heavy"?GLUTE_EX:UPPER_EX).filter(n=>!existing.includes(n));
      const [q,setQ]=useState("");
      return(
        <Sheet onClose={onClose}>
          <div style={{fontSize:20,fontWeight:800,color:T.ink,marginBottom:14}}>Übung hinzufügen</div>
          <div style={{display:"flex",gap:8,marginBottom:12}}>
            <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Eigene Übung …" style={{flex:1,padding:"12px 14px",borderRadius:13,border:`1.5px solid ${T.br2}`,background:T.bg,fontSize:14.5,color:T.ink}}/>
            {q.trim()&&<button onClick={()=>onPick(q.trim())} style={{background:T.rose,color:"#fff",borderRadius:12,padding:"0 18px",fontWeight:700,fontSize:14}}>OK</button>}
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            {pool.map(name=>{const p=suggestNext(name,type,sessions);
              return(<button key={name} onClick={()=>onPick(name)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",...CARD,borderRadius:14,padding:"12px 14px",textAlign:"left"}}>
                <span style={{fontSize:14.5,color:T.ink,fontWeight:600}}>{name}</span>
                {p.weight>0&&<span style={{fontFamily:MONO,fontSize:12.5,color:T.t2,fontWeight:600}}>{fmtW(p.weight)}{p.unit==="pS"?" pS":""}</span>}
              </button>);})}
          </div>
        </Sheet>);
    }

    function Settings({sessions,onClose}){
      const [gas,setGas]=useState(gGas());
      const exportData=()=>{
        const d=rLS(); if(!d||!d.length)return;
        const blob=new Blob([JSON.stringify(d,null,2)],{type:"application/json"});
        const url=URL.createObjectURL(blob);const a=document.createElement("a");
        a.href=url;a.download="dianafit-backup-"+localDate()+".json";a.click();URL.revokeObjectURL(url);
      };
      return(
        <Sheet onClose={()=>onClose(false)}>
          <div style={{fontSize:22,fontWeight:800,color:T.ink,marginBottom:2}}>Einstellungen</div>
          <div style={{fontSize:13.5,color:T.muted,marginBottom:20}}>v5 · {sessions.length} Sessions im Speicher</div>
          <div style={{marginBottom:16}}>
            <div style={{...EYEBROW,marginBottom:6}}>Google Apps Script URL</div>
            <input value={gas} onChange={e=>setGas(e.target.value)} placeholder="https://script.google.com/macros/s/…" style={{width:"100%",padding:"12px 14px",borderRadius:13,border:`1.5px solid ${T.br2}`,background:T.bg,fontSize:13.5,color:T.ink}}/>
            <div style={{fontSize:12,color:T.muted2,marginTop:5}}>Aus dem GAS-Deployment kopieren. Einmalig.</div>
          </div>
          <button onClick={()=>{localStorage.setItem(GK,gas.trim());onClose(true);}} style={{width:"100%",height:52,borderRadius:15,background:`linear-gradient(135deg,${T.rose},${T.roseD})`,color:"#fff",fontSize:15,fontWeight:800}}>Speichern & neu laden</button>
          <button onClick={exportData} style={{width:"100%",height:46,borderRadius:15,border:`1.5px solid ${T.br2}`,color:T.t2,fontSize:14,fontWeight:600,marginTop:10}}>↓ Backup exportieren (JSON)</button>
        </Sheet>);
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
